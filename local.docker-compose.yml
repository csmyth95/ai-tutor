services:
  frontend:
    build:
      context: ./frontend/ai-tutor
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/local.env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network

  backend:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/server/local.env
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
    networks:
      - app-network

  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    env_file:
      - database/local.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  llm:
    image: ollama/ollama:latest
    deploy:
      resources:
        limits:
          memory: 6G
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  ollama:
